<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dish Explorer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">


</head>

<body>

```


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            Dish Explorer
        </a>

        <div>

            <a href="index.html" class="text-white me-3 text-decoration-none">
                Home
            </a>

            <a href="#dishes" class="text-white text-decoration-none">
                Dishes
            </a>

        </div>

    </div>

</nav>




<div class="container text-center my-5">

    <h1>Delicious Dishes</h1>

    <p class="text-muted">
        Explore different dishes and their recipes
    </p>

</div>




<div class="container">

    <div id="dishes" class="row">

    </div>

</div>



<footer class="bg-dark text-white text-center mt-5 py-3">

    <p class="mb-0">
        Dish Explorer &copy; 2026
    </p>

</footer>


<script>

    let output = document.getElementById("dishes");


    fetch("https://www.themealdb.com/api/json/v1/1/search.php?s=")

        .then(response => response.json())

        .then(data => {

            let meals = data.meals;

            meals.forEach(meal => {

                output.innerHTML += `

                    <div class="col-md-4 mb-4">

                        <div class="card">

                            <img
                                src="${meal.strMealThumb}"
                                class="card-img-top"
                                style="height:220px; object-fit:cover;"
                            >

                            <div class="card-body">

                                <h5 class="card-title">
                                    ${meal.strMeal}
                                </h5>

                                <p class="card-text">
                                    Category: ${meal.strCategory}
                                </p>

                                <p class="card-text">
                                    Area: ${meal.strArea}
                                </p>

                                <a
                                    href="details.html?id=${meal.idMeal}"
                                    class="btn btn-dark"
                                >
                                    See Details
                                </a>

                            </div>

                        </div>

                    </div>

                `;

            });

        })

        .catch(error => {

            console.log(error);

            output.innerHTML = `
                <p class="text-danger">
                    Something went wrong.
                </p>
            `;

        });

</script>


</body>

</html>
